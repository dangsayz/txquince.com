name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm the production release
        required: true
        type: choice
        options:
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy txquince.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUILD_ENV_FILE: ${{ secrets.BUILD_ENV_FILE }}
      PRODUCTION_URL: https://txquince.com

    steps:
      - name: Verify production intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$CONFIRMATION" = "DEPLOY"
          test "$RELEASE_REF" = "refs/heads/main"

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BUILD_ENV_FILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the production build environment
        shell: bash
        run: printf '%s' "$BUILD_ENV_FILE" > .env.local

      - name: Deploy to Cloudflare
        run: npm run deploy:cloudflare

      - name: Verify production health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$PRODUCTION_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check failed: $PRODUCTION_URL"
          exit 1

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.local
